<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map with D3.js</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/topojson.v2.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            overflow:hidden;
        }

        #map{
            width: 960px;
            height:600px;
            position: fixed;
            top: 0; /* Align to the top */
            left: 0; /* Align to the left */
            overflow: hidden; /* Prevent any overflow */
        }
        .tooltip {
            position: absolute;
            text-align: center;
            width: auto;
            padding: 5px;
            font: 12px sans-serif;
            background: lightsteelblue;
            border: 0;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
        }

        .country {
            fill: #ccc;
            stroke: #333;
            stroke-width: 0.5;
            cursor: pointer;
        }

        .country:hover {
            fill: orange;
        }
        .text{
            position: fixed; /* Position text absolutely within the container */
            top: 300px; /* Center vertically */
            right: 70px; /* Center horizontally */
            font-size: 20px; /* Font size */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .money-bag1 {
            position: fixed;
            bottom: 21%;
            right: 50px;
            width: 150px;
            /* Set width */
            height: 200px;
            /* Maintain aspect ratio */
        }

        .money-bag2 {
            position: fixed;
            bottom: 21%;
            right: 270px;
            transform: translateX(-50%);
            transition: transform 0.2s ease;
            width: 150px;
            /* Set width */
            height: 200px;
            /* Smooth scaling transition */
        }
        .hoverCountry{
            position: fixed; /* Position text absolutely within the container */
            bottom: 15%;
            right: 18.5%;
            font-size: 14px; /* Font size */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        .USstats{
            position: fixed; /* Position text absolutely within the container */
            bottom: 15%;
            right: .5%;
            font-size: 14px; /* Font size */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div class = "text" id = "overlayText">Hover over a country on the map to <br/> see how that country's average budget <br/> per movie compares to the U.S.</div>
    <div class = "USstats" id = "USstats"> United States <br/> Avg. Budget per movie: $28,446,716</div>
    <div class = "hoverCountry" id = "other"></div>
    <div class="tooltip" id="tooltip"></div>
    <img class="money-bag1" src="moneyBag.png" />
    <img class="money-bag2" src="moneyBag.png" />

            // Add more country data as needed
        };

        const usAverage = 28446716
        const moneyBag1Width = 150; // Original width of money-bag1
        const moneyBag1Height = 200; // Original height of money-bag1
        // Load the TopoJSON data
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json").then(data => {
            const countries = topojson.feature(data, data.objects.countries).features;


            const svg = d3.select("#map").append("svg")
                .attr("width", width)
                .attr("height", height);

            svg.selectAll(".country")
                .data(countries)
                .enter().append("path")
                .attr("class", "country")
                .attr("d", path)
                .attr("fill", "#ccc")
                .attr("stroke", "#333")
                .on("mouseover", (event, d) => {
                    const countryName = d.properties.name;
                    const countryCode = d.id.toString();

                    // Look up the country data
                    const info = countryData[countryCode] || "No info available";
                    const countryBudget = countryData[countryCode] ? parseFloat(countryData[countryCode].split('$')[1].replace(/,/g, '')) : 0;

                    // Scale the size of money-bag2 based on the country's average budget
                    const scaleFactor = countryBudget / usAverage; // Scale factor relative to U.S. average
                    const newScale = scaleFactor;

                    // Update the money-bag2 size
                    d3.select('.money-bag2')
                        .style('transform', `translateX(-50%) scale(${newScale})`);

                    d3.select('#other')
                        .html(`${countryName}<br>Avg. Budget per movie: ${info}`);
                    tooltip.transition()
                        .duration(200)
                        .style("opacity", .9);
                    tooltip.html(`${countryName}<br>${info}`)
                        .style("left", (event.pageX + 5) + "px")
                        .style("top", (event.pageY - tooltip.node().getBoundingClientRect().height - 5) + "px");
                })
                .on("mouseout", () => {
                    tooltip.transition()
                        .duration(500)
                        .style("opacity", 0);

                    d3.select('.money-bag2')
                        .style('transform', 'translateX(-50%) scale(1)');
                });
        }).catch(error => {
            console.error("Error loading or parsing data:", error);
        });
    </script>
</body>

</html>
